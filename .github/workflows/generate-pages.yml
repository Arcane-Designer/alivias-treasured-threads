name: Keep Studio product pages current

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/site.json'
      - 'scripts/generate-pages.mjs'
      - '.github/workflows/generate-pages.yml'

permissions:
  contents: write

concurrency:
  group: studio-generated-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate pages
        env:
          GENERATE_BASE: ${{ vars.GENERATE_BASE || 'https://aliviastreasuredthreads.com' }}
        run: node scripts/generate-pages.mjs --base "$GENERATE_BASE"

      - name: Validate
        run: node scripts/validate.mjs

      - name: Commit regenerated crawlable pages
        env:
          GENERATE_BASE: ${{ vars.GENERATE_BASE || 'https://aliviastreasuredthreads.com' }}
        run: |
          if git diff --quiet; then
            echo "Generated pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop product sitemap.xml robots.txt
          git commit -m "Refresh generated Shop pages from Studio data"
          # A publish from the Studio can land while this run is working. Rebase
          # onto it and regenerate rather than failing and leaving pages stale.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Remote moved, rebasing and regenerating (attempt $attempt)."
            git pull --rebase --autostash origin main
            node scripts/generate-pages.mjs --base "$GENERATE_BASE"
            git add shop product sitemap.xml robots.txt
            git diff --cached --quiet || git commit --amend --no-edit
          done
          echo "Could not push regenerated pages after 3 attempts." >&2
          exit 1
