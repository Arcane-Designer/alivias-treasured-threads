name: Keep Studio product pages current

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/site.json'
      - 'scripts/generate-pages.mjs'
      - '.github/workflows/generate-pages.yml'

permissions:
  contents: write

concurrency:
  group: studio-generated-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate pages
        env:
          GENERATE_BASE: ${{ vars.GENERATE_BASE || 'https://arcane-designer.github.io/alivias-treasured-threads' }}
        run: node scripts/generate-pages.mjs --base "$GENERATE_BASE"

      - name: Validate
        run: node scripts/validate.mjs

      - name: Commit regenerated crawlable pages
        run: |
          if git diff --quiet; then
            echo "Generated pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop product sitemap.xml robots.txt
          git commit -m "Refresh generated Shop pages from Studio data"
          git push
